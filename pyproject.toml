[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-covert-channel"
version = "0.1.0"
description = "Covert channel encoding over DNS/ICMP/HTTP (educational)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["covert"]
